<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPOSTURE - Mingqi Wang</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="simpleproject_format.css">
</head>
<body>

    <header>
        <div class="logo">
            <a href="home.html">
                <img src="images/personal_logo.svg" alt="Mingqi Wang Logo">
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="research.html">Research</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
        <button class="mobile-menu-toggle" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <!-- Project Title Section -->
    <section class="project-title">
        <h1>UPOSTURE</h1>
        <div class="title-item">
            <div class="project-info">
                <p class="project-meta">2024 | Academic Work</p>
                <p class="project-member">Project Member: Mingqi Wang, Yifan Hou, Qiting Yu</p>
            </div>
            <div class="project-category">
                <p class="category-name">Wearable Technologies for Health</p>
                <div class="tools">
                    <img src="images/fusion_logo.png" alt="Fusion">
                    <img src="images/arduino_logo.png" alt="Arduino">
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content - Project Images -->
    <main class="project-content">
        <img src="images/uposture/uposture1.PNG" alt="UPOSTURE Image 1" class="project-image">
        <img src="images/uposture/uposture2.PNG" alt="UPOSTURE Image 2" class="project-image">
        <img src="images/uposture/uposture3.PNG" alt="UPOSTURE Image 3" class="project-image">
        <img src="images/uposture/uposture4.PNG" alt="UPOSTURE Image 4" class="project-image">
        <img src="images/uposture/uposture5.PNG" alt="UPOSTURE Image 5" class="project-image">
        <img src="images/uposture/uposture6.PNG" alt="UPOSTURE Image 6" class="project-image">
        <img src="images/uposture/uposture7.PNG" alt="UPOSTURE Image 7" class="project-image">
        <img src="images/uposture/uposture8.PNG" alt="UPOSTURE Image 8" class="project-image">
    </main>

    <footer>
        <p>&copy; 2025 Mingqi Wang. All rights reserved.</p>
    </footer>

    <script>
        // Mobile menu toggle
        const mobileMenuToggle = document.querySelector('.mobile-menu-toggle');
        const nav = document.querySelector('header nav');

        mobileMenuToggle.addEventListener('click', () => {
            nav.classList.toggle('active');
            mobileMenuToggle.classList.toggle('active');
        });
    </script>
</body>
</html>
